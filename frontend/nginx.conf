server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Disable server version disclosure.
    server_tokens off;

    # Reject non-read methods at the edge (the SPA only needs GET/HEAD).
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Security headers (Caddy also sets these upstream, but defense-in-depth).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Deny access to dotfiles (e.g. `.env` would never be shipped, but just in case).
    location ~ /\. {
        deny all;
    }

    # Aggressively cache immutable fingerprinted assets (Vite emits hashed filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Short cache for other static assets (icons, etc.).
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp|avif|ico)$ {
        expires 1d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback — every non-asset path serves index.html so React Router handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Return 404 for requests to /api/* that reach the frontend (they should hit Caddy → Strapi).
    location /api/ {
        return 404;
    }
}
